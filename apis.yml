aid: craft
name: craft
description: >-
  Craft (Craft Docs Ltd.) is a consumer and team productivity app that combines
  notes, documents, tasks, and daily planning in a single cross-platform
  workspace for macOS, iOS, iPadOS, Windows, and web. Beyond the end-user app,
  Craft exposes a developer surface through its "Imagine" platform: an official
  eXtension API (a TypeScript/JavaScript SDK, @craftdocs/craft-extension-api, for
  building extensions that run inside Craft), a Craft Connect REST API that
  exposes a user's Space, Daily Notes, tasks, and selected documents, and an
  official remote MCP server that connects Craft to Claude, ChatGPT, Cursor, and
  other MCP clients. Documentation is published on a Mintlify help center with a
  machine-readable llms.txt, and the company states SOC 2, ISO 27001, and GDPR
  compliance.
